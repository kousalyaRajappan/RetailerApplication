plugins {
    alias(libs.plugins.android.application)
    id "realm-android"          // ✅ REQUIRED
}

android {
    namespace 'com.za.toptitup.retailerapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.za.toptitup.retailerapp"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    // ✅ REALM (DO NOT USE VERSION CATALOG)
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'

    implementation "io.realm:realm-android-library:10.19.0"
    testImplementation(libs.junit) // Instrumented Android tests androidTestImplementation(libs.androidx.junit) androidTestImplementation(libs.espresso.core)
    implementation project(":loginlibrary")

}