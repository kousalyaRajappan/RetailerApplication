plugins {
    alias(libs.plugins.android.library)
    id "realm-android"
}

android {
    namespace 'com.za.toptitup.loginlibrary'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk 23
        targetSdk 34
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0'
            ]
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    flatDir { dirs 'libs' }
}

dependencies {
    // Local AAR/JAR files
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation files('libs/btsdk.jar')
    implementation files('libs/usbsdk.jar')
    implementation files('libs/Android_Print_SDK_ESC_V1.11.jar')
    implementation files('libs/java-json.jar')
    implementation files('libs/SDK4BaseBinderV2.1.5.jar')
    implementation files('libs/SDK4EmvBinderV2.1.5.jar')
    implementation files('libs/SDK4KeyManagerBinderV2.1.5.jar')
    implementation files('libs/CashierInvoke_202002261912.jar')
    // removed old core-3.3.0.jar and zixng.jar

    // WiseSdk AAR files (uncomment if needed)
    // implementation(name: 'WiseSdk_D_1.09_00a_240325', ext: 'aar') {
    //     exclude group: 'com.google.zxing', module: 'core'
    // }
    // implementation(name: 'WiseSdk_P_1.29_00a_24041501', ext: 'aar')
    //implementation 'androidx.core:core-ktx:1.12.0'

    // AndroidX Core Libraries
    implementation libs.appcompat
   implementation libs.core.ktx
    implementation libs.annotation
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.cardview

    // Lifecycle Components
    implementation libs.lifecycle.process
    implementation libs.lifecycle.common.java8
    // removed old lifecycle.extensions

    // Room Database
    implementation libs.room.runtime
    annotationProcessor libs.androidx.room.compiler

    // Realm Database
    implementation libs.realm.android.library

    // Networking
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.logging.interceptor
    implementation libs.gson

    // Image Loading
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    implementation libs.glide.okhttp3.integration

    // UI Libraries
    implementation libs.android.gif.drawable
    implementation libs.roundedimageview
    implementation libs.toasty
    api libs.toasty

    // Utilities
    implementation libs.commons.lang3
    implementation libs.guava
    implementation libs.timber

    // Phone Number
    implementation libs.ccp
    implementation libs.libphonenumber

    // Barcode/QR Scanner
    implementation(libs.zxing.android.embedded) {
        exclude group: 'com.google.zxing', module: 'core'
    }
    implementation libs.zxing.core

    // Firebase
    implementation libs.firebase.crashlytics
    implementation libs.firebase.analytics

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.espresso.core

    implementation "com.balysv:material-ripple:1.0.2"

}
